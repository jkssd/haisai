<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>靶子关键点标注 / 复核</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="loupe" class="hidden"></canvas>
    <div id="hud">
      <span id="hud-name">—</span>
      <span id="hud-meta"></span>
    </div>
    <div id="tip" class="hidden"></div>
  </div>

  <aside id="side">
    <div class="block">
      <div class="row">
        <button id="btn-prev" title="上一张 (P)">◀ 上一张</button>
        <button id="btn-next" title="下一张 (N)">下一张 ▶</button>
      </div>
      <div class="row">
        <button id="btn-accept" class="primary" title="保存并下一张 (A)">保存并下一张 (A)</button>
      </div>
      <div class="row">
        <button id="btn-save" title="保存 (Ctrl+S)">保存</button>
        <button id="btn-refine" title="几何精修 (R)">精修 (R)</button>
      </div>
      <label class="chk"><input type="checkbox" id="chk-center-only"> 精修只动圆心（靶框不可见时勾选）</label>
    </div>

    <div class="block">
      <div class="row">
        <select id="sel-scene"></select>
      </div>
      <div class="row">
        <select id="sel-filter">
          <option value="all">全部</option>
          <option value="todo">未标注</option>
          <option value="todo_auto">待纠正(自动标注)</option>
          <option value="unreviewed">未复核</option>
          <option value="auto">自动预标注</option>
          <option value="bootstrap">种子集(60张)</option>
        </select>
        <button id="btn-jump" title="跳到下一张待处理">跳到待处理</button>
      </div>
      <div class="row">
        <button id="btn-reload" title="重新扫描磁盘上的标注（自动标注跑完后点这个）">刷新列表</button>
      </div>
      <div class="row small" id="progress">—</div>
    </div>

    <div class="block">
      <div class="block-title">靶子列表</div>
      <ul id="obj-list"></ul>
      <div class="row">
        <button id="btn-new" class="primary" title="新建靶子 (N 键不行，用按钮)">＋ 新建靶子</button>
        <button id="btn-del" title="删除选中 (Del)">删除</button>
      </div>
      <div class="row">
        <button id="btn-hint">按提示生成靶框</button>
      </div>
      <div class="row small">圆按型号一键生成（靶框被裁/圆看不清时用这个）</div>
      <div class="row">
        <button id="btn-c0" title="按「大」的比例生成圆">圆·大</button>
        <button id="btn-c1" title="按「中」的比例生成圆">圆·中</button>
        <button id="btn-c2" title="按「小」的比例生成圆">圆·小</button>
      </div>
      <div class="row small">提示框放大倍数
        <input id="inp-hint-scale" type="number" step="0.05" min="1" max="3" value="1.45">
      </div>
    </div>

    <div class="block">
      <div class="block-title">显示</div>
      <label class="chk"><input type="checkbox" id="chk-loupe" checked> 放大镜</label>
      <label class="chk"><input type="checkbox" id="chk-snap" checked> 边缘吸附</label>
      <label class="chk"><input type="checkbox" id="chk-grid"> 三分网格</label>
      <label class="chk"><input type="checkbox" id="chk-hints" checked> 显示提示框</label>
      <label class="chk"><input type="checkbox" id="chk-blind"> 盲标模式(隐藏已有标注)</label>
      <div class="row small">
        <button id="btn-fit">适应窗口 (F)</button>
      </div>
      <div class="keys small">
        <div><b>N/P</b> 下一张/上一张　<b>A</b> 保存并下一张</div>
        <div><b>R</b> 精修　<b>Ctrl+S</b> 保存　<b>Esc</b> 取消新建</div>
        <div><b>Del</b> 删除选中　<b>1-9</b> 选择靶子　<b>Z</b> 撤销</div>
        <div><b>滚轮</b> 缩放　<b>右键/空格拖动</b> 平移　<b>F</b> 适应</div>
      </div>
    </div>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
